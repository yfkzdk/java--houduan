server:
  port: 8080

spring:
  application:
    name: agentic-chatbot
  # ── H2 内嵌数据库，无需外部 MySQL ──
  datasource:
    url: jdbc:h2:mem:agentic_chatbot;DB_CLOSE_DELAY=-1;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:dev-secret-not-for-production}
  expiration: 604800
  token-header: Authorization
  token-head: "Bearer "

ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}
  timeout-seconds: 120
  max-retries: 2

rate-limit:
  chat-per-minute: 20
  login-per-minute: 5
  upload-per-hour: 5

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

secure:
  ignored:
    urls:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
      - /actuator/**
      - /h2-console/**
      - /favicon.ico
