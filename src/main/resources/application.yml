server:
  port: 8080

spring:
  application:
    name: agentic-chatbot
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/agentic_chatbot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ── JWT ──
jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-env-var}
  expiration: 604800        # 7 days (seconds)
  token-header: Authorization
  token-head: "Bearer "

# ── AI Service (Python FastAPI) ──
ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}
  timeout-seconds: 120
  max-retries: 2

# ── Rate Limit ──
rate-limit:
  chat-per-minute: 20
  login-per-minute: 5
  upload-per-hour: 5

# ── Swagger ──
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

# ── Security whitelist ──
secure:
  ignored:
    urls:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
      - /actuator/**
      - /favicon.ico
