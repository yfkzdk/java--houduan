server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql-service:3306/agentic_chatbot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis-service}
      port: 6379

jwt:
  secret: ${JWT_SECRET}

ai:
  service-url: ${AI_SERVICE_URL:http://python-ai-service:8000}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
